services:
# ======================================
# Infrastructure (DEV Ports)
# ======================================
  postgres:
    ports:
      - "5432:5432"

  mongo:
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6379:6379"

  elasticsearch:
    ports:
      - "9200:9200"

  kibana:
    ports:
      - "5601:5601"

  jaeger:
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  loki:
    ports:
      - "3100:3100"

  promtail:
    ports:
      - "9080:9080"

  grafana:
    ports:
      - "3000:3000"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

# ======================================
# Catalog API (DEV Ports + Env)
# ======================================
  catalog.api:
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CatalogDB=Host=postgres;Port=5432;Database=catalog_db;Username=postgres;Password=postgres
      - ConnectionStrings__MongoDB=mongodb://mongo:27017
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__Elasticsearch=http://elasticsearch:9200
      - MongoDB__DatabaseName=CatalogDB
      - Elasticsearch__Uri=http://elasticsearch:9200
      - JwtSettings__Secret=your-super-secret-key-min-32-chars-long-for-development-only
      - JwtSettings__Issuer=FCG.CatalogService
      - JwtSettings__Audience=FCG.Client
      - ConnectionStrings__RabbitMQ=amqp://guest:guest@rabbitmq:5672
      - Loki__Uri=http://loki:3100
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
